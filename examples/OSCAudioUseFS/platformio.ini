; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Dynamic Audio: cores from h4yn0nnym0u5e/cores (feature/Audio/dynamic-updates,
; TD 1.62). G:/_git/framework-arduinoteensy-dynamic is a small package whose
; "cores" is a junction to G:/_git/cores-dynamic and "libraries" a junction to
; PlatformIO's stock Teensy libraries.
platform_packages =
    framework-arduinoteensy @ symlink://G:/_git/framework-arduinoteensy-dynamic
; Dual USB serial: Serial = debug/programming, SerialUSB1 = OSC live update.
; No USB MIDI in this type; MIDI.ino compiles its usbMIDI parts out.
build_flags = -D USB_DUAL_SERIAL -D OSC_USE_USB_SERIAL
; OSCAudio's library.properties declares depends=OSC,Audio, so PlatformIO gives it only those include
; dirs; this one lets OSCAudioBase.h find <AudioEffectFPB.h> (Arduino IDE needs nothing extra).
    -I G:/_git/__TEENSY/manicken.github.io/fpb/teensy/FPB/src
; OSCAudio itself is used straight from this repo (two levels up), so
; there is no need to copy its files into src/.
; A newer CNMAT/OSC than the one shipped with Teensyduino is required
; (getBlobLength() etc.); a copy lives in lib/OSC. It must be listed
; explicitly: because this project sits inside the OSCAudio repo,
; PlatformIO's dependency finder would otherwise attribute its headers
; to OSCAudio. Outside this repo, https://github.com/CNMAT/OSC.git works.
; Audio is the dynamic fork (h4yn0nnym0u5e/Audio, features/dynamic-updates),
; which overrides the framework's stock Audio library.
; FPB (float patch bytecode, runtime-loaded patches, i.e. Faust): the library from the
; Design Tool++ repo. OSCAudio picks it up by itself (__has_include) and registers
; "AudioEffectFPB" for /dynamic/crOb.
lib_deps =
    symlink://G:/_git/Audio-dynamic
    symlink://lib/OSC
    symlink://../..
    symlink://G:/_git/__TEENSY/manicken.github.io/fpb/teensy/FPB
; this next line is only to debug preprocessing output
;build_flags = -D USB_MIDI_SERIAL -E